[package]
name = "ferzdb"
version = "0.1.0"
edition = "2021"
authors = ["FerzDB Team"]
description = "FerzDB - Modern SQL database with offline-first capabilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/ferzdb"
default-run = "ferzcli"

[lib]
name = "ferzdb"
path = "src/lib.rs"

[[bin]]
name = "ferzcli"
path = "src/bin/ferzcli.rs"

# Server daemon
[[bin]]
name = "ferzdbd"
path = "src/bin/ferzdbd.rs"

[dependencies]
# Core library has zero dependencies for now
# CLI dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = ["cli"]
cli = ["dep:clap"]

# Benchmarks will be added later
# [[bench]]
# name = "btree_bench"
# harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
